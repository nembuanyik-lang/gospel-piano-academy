<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Gospel Piano Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout concept: a calm app shell. Sticky header, bottom tab bar on phones and top navigation on wide screens.
   Ebony and ivory keys carry the identity; velvet red is the one accent, brass marks achievement. */
:root {
  --bg: #ECECE8;
  --surface: #FFFFFF;
  --surface2: #F5F5F2;
  --line: #D9D9D3;
  --fg: #17181C;
  --muted: #5B5D66;
  --accent: #9B1C3C;
  --accent-fg: #FFFFFF;
  --accent-soft: #F5E2E7;
  --gold: #8A5B0A;
  --gold-soft: #F4E7C9;
  --ok: #17794A;
  --ok-soft: #DCF1E5;
  --warn: #9E4608;
  --warn-soft: #FAE6D3;
  --key-white: #FBFBF8;
  --key-white-edge: #C9C9C2;
  --key-black: #17181C;
  --key-hint: #F2C9D3;
  --key-on: #E3AE45;
  --shadow: 0 1px 2px rgba(20, 20, 24, .06), 0 6px 18px rgba(20, 20, 24, .05);
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Hanken Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Segoe UI Symbol', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0F12; --surface: #17191E; --surface2: #1E2127; --line: #2C3038; --fg: #EDEBE7; --muted: #A0A2AC;
    --accent: #E8627F; --accent-fg: #1A0509; --accent-soft: #3A1823;
    --gold: #E3B04C; --gold-soft: #3A2E14; --ok: #54C98D; --ok-soft: #123221; --warn: #F29A52; --warn-soft: #3B2512;
    --key-white: #ECEAE4; --key-white-edge: #6A6A66; --key-black: #08090B; --key-hint: #6B2A3B; --key-on: #E3AE45;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0F12; --surface: #17191E; --surface2: #1E2127; --line: #2C3038; --fg: #EDEBE7; --muted: #A0A2AC;
  --accent: #E8627F; --accent-fg: #1A0509; --accent-soft: #3A1823;
  --gold: #E3B04C; --gold-soft: #3A2E14; --ok: #54C98D; --ok-soft: #123221; --warn: #F29A52; --warn-soft: #3B2512;
  --key-white: #ECEAE4; --key-white-edge: #6A6A66; --key-black: #08090B; --key-hint: #6B2A3B; --key-on: #E3AE45;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.85rem; font-weight: 800; }
h2 { font-size: 1.45rem; font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 700; }
h4 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-feature-settings: "tnum"; }
.muted { color: var(--muted); }
.tiny { font-size: .82rem; color: var(--muted); }
.nowrap { white-space: nowrap; }
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -.2em; }
.ic.rot { transform: rotate(90deg); }

/* ---------- shell ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; min-height: 56px; }
.brand { display: flex; align-items: center; gap: .6rem; background: none; border: 0; padding: .25rem 0; font-family: var(--font-display); font-weight: 800; font-size: 1.02rem; letter-spacing: -.01em; min-width: 0; }
.brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bm-a { fill: var(--key-white); stroke: var(--fg); stroke-width: 1.4; }
.bm-b { stroke: var(--key-white-edge); stroke-width: 1; fill: none; }
.bm-c { fill: var(--accent); }
.topnav { display: none; gap: .25rem; margin-left: auto; }
.topnav button { background: none; border: 0; padding: .55rem .8rem; border-radius: 999px; font-weight: 600; color: var(--muted); }
.topnav button.on { background: var(--accent-soft); color: var(--accent); }
.top-r { margin-left: auto; display: flex; align-items: center; gap: .5rem; }
.topnav + .top-r { margin-left: 0; }
.chip-xp { display: flex; align-items: center; gap: .35rem; border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: .35rem .7rem; font-weight: 700; font-family: var(--font-mono); font-size: .9rem; }
.chip-xp small { font-family: var(--font-body); font-weight: 500; color: var(--muted); display: none; }
.chip-xp .ic { color: var(--gold); fill: var(--gold); }
.chip-xp.on, .avatar.on { border-color: var(--accent); }
.avatar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--accent); color: var(--accent-fg); font-weight: 800; font-family: var(--font-display); }
#main { max-width: 980px; margin: 0 auto; padding-block: 1.25rem 7.5rem; outline: none; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around; background: var(--surface); border-top: 1px solid var(--line); padding: .35rem max(8px, env(safe-area-inset-right, 0px)) calc(.35rem + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: .15rem; background: none; border: 0; padding: .35rem .1rem; font-size: .68rem; font-weight: 600; color: var(--muted); border-radius: 10px; }
.tabbar button .ic { width: 1.5rem; height: 1.5rem; }
.tabbar button.on { color: var(--accent); }
body.focus .tabbar { display: none; }
body.focus #main { padding-bottom: 2rem; }
@media (min-width: 760px) {
  .tabbar { display: none; }
  .topnav { display: flex; }
  .chip-xp small { display: inline; }
  #main { padding-bottom: 3rem; }
}
.toast { position: fixed; left: 50%; bottom: calc(5.4rem + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); background: var(--fg); color: var(--bg); padding: .6rem 1rem; border-radius: 999px; font-weight: 600; font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 40; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.xp { background: var(--gold-soft); color: var(--gold); border: 1px solid var(--gold); }
@media (min-width: 760px) { .toast { bottom: 2rem; } }

/* ---------- layout primitives ---------- */
.screen { display: flex; flex-direction: column; gap: 1rem; }
.screen.narrow { max-width: 640px; margin: 0 auto; width: 100%; }
.pagehead { display: flex; flex-direction: column; gap: .5rem; align-items: flex-start; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1.1rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: .8rem; min-width: 0; }
.hero-card { border-color: var(--accent); background: linear-gradient(180deg, var(--surface), var(--surface)) padding-box; }
.hero-card h2 { font-size: 1.55rem; }
.row { display: flex; gap: .6rem; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.split { display: flex; justify-content: space-between; align-items: flex-start; gap: .75rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: .8rem; }
.prose p { max-width: 65ch; }
.prose { gap: .9rem; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 44px; padding: .55rem 1rem; border-radius: 12px; border: 1px solid transparent; font-weight: 700; background: var(--surface2); color: var(--fg); text-align: center; }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.sm { min-height: 38px; padding: .35rem .75rem; font-size: .9rem; border-radius: 10px; }
.btn.lg { min-height: 52px; font-size: 1.05rem; padding: .7rem 1.3rem; align-self: flex-start; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: .45rem; }
.chip { min-height: 40px; min-width: 44px; padding: .3rem .8rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface2); font-weight: 600; }
.chip.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chip-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 64px; min-height: 56px; padding: .35rem .7rem; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); gap: .05rem; }
.chip-btn span { font-size: .78rem; color: var(--muted); }
.chip-btn:hover { border-color: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface2); max-width: 100%; }
.seg button { min-height: 40px; padding: .3rem .9rem; border: 0; background: none; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--accent-fg); }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; }
.switch { display: inline-flex; align-items: center; gap: .55rem; min-height: 40px; font-weight: 500; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: .3rem; min-width: 0; font-weight: 600; font-size: .9rem; }
.field input[type="text"], .field select, .field textarea, select { width: 100%; min-height: 44px; padding: .5rem .7rem; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); font-weight: 500; }
textarea { resize: vertical; line-height: 1.45; }
input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 32px; }
.tag { display: inline-flex; align-items: center; font-size: .75rem; font-weight: 700; text-transform: none; letter-spacing: 0; padding: .1rem .5rem; border-radius: 999px; background: var(--surface2); color: var(--muted); border: 1px solid var(--line); }
.tag.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
/* accessibility */
#main:focus { outline: none; }
.field input, .field select, input[type=text], select { min-height: 44px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.skip-link { position: fixed; left: .75rem; top: -4rem; z-index: 100; background: var(--accent); color: var(--accent-fg); padding: .7rem 1rem; border: 0; border-radius: 10px; font-weight: 700; }
.skip-link:focus { top: .75rem; }
.btn.sm, .btn.ghost.sm, .btn.primary.sm, .btn.sm.ghost { min-height: 44px; }
.chip, .chip-btn, .seg button, .switch, .topnav button, .brand, .level .lvl-head { min-height: 44px; }
.chip-xp { min-height: 44px; min-width: 44px; }
.avatar { width: 44px; height: 44px; }
.wk:focus-visible, .bk:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 5; }
.switch input { width: 24px; height: 24px; }
.tag.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; white-space: normal; margin-top: .6rem; }
.callout { margin-top: .8rem; padding: .9rem 1rem; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); }
.callout p { margin: 0 0 .6rem; }
.bar { height: 8px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); overflow: hidden; width: 100%; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
.bar.good i { background: var(--ok); }
.bar.warn i { background: var(--warn); }

/* ---------- home ---------- */
.greet { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; }
.stats { display: flex; gap: .5rem; }
.stat { display: inline-flex; align-items: center; gap: .35rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .4rem .7rem; }
.stat b { font-family: var(--font-mono); }
.stat small { color: var(--muted); }
.stat .ic { color: var(--gold); }
.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
.todo li { display: grid; grid-template-columns: 28px 1fr auto; gap: .7rem; align-items: center; padding: .6rem; border: 1px solid var(--line); border-radius: 12px; background: var(--surface2); }
.todo li > div { display: flex; flex-direction: column; min-width: 0; }
.todo .tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.todo li.done .tick { background: var(--ok); border-color: var(--ok); color: #fff; }
.todo .tick .ic { width: 14px; height: 14px; stroke-width: 3; }
.week { display: flex; justify-content: space-between; gap: .3rem; }
.day { display: flex; flex-direction: column; align-items: center; gap: .2rem; }
.day i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); }
.day.on i { background: var(--accent); border-color: var(--accent); }
.day.today i { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--fg); }
.day small { font-size: .7rem; color: var(--muted); }
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .8rem; }
.tool { display: flex; flex-direction: column; align-items: flex-start; gap: .2rem; text-align: left; padding: 1rem; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
.tool .ic { width: 1.6rem; height: 1.6rem; color: var(--accent); }
.tool b { font-family: var(--font-display); font-size: 1.05rem; }
.tool span { color: var(--muted); font-size: .88rem; }

/* ---------- course ---------- */
.level .lvl-head { display: flex; justify-content: space-between; align-items: center; background: none; border: 0; padding: 0; text-align: left; width: 100%; gap: 1rem; }
.lvl-meta { display: flex; align-items: center; gap: .6rem; }
.module { display: flex; flex-direction: column; gap: .6rem; padding-top: .8rem; border-top: 1px solid var(--line); }
.lessons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .4rem; }
.lrow { display: grid; grid-template-columns: 32px 1fr auto; gap: .7rem; align-items: center; padding: .55rem .6rem; border: 1px solid var(--line); border-radius: 12px; background: var(--surface2); }
.lrow.locked { opacity: .7; }
.lmain { display: flex; flex-direction: column; min-width: 0; }
.lmain b { overflow-wrap: anywhere; }
.lstat { display: grid; place-items: center; color: var(--muted); }
.lrow.done .lstat, .lrow.mastered .lstat { color: var(--ok); }
.lrow.mastered .lstat { color: var(--gold); }
.lrow.mastered .lstat .ic { fill: var(--gold); }
.ring, .half { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); display: block; }
.half { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
.testout { display: flex; justify-content: space-between; align-items: center; gap: .7rem; flex-wrap: wrap; padding: .6rem .8rem; border: 1px dashed var(--line); border-radius: 12px; }
.road summary { cursor: pointer; font-weight: 700; padding: .45rem 0; }
.road ul { margin: .2rem 0 .6rem 1.2rem; padding: 0; color: var(--muted); }

/* ---------- lesson ---------- */
.lh { display: flex; flex-direction: column; gap: .5rem; align-items: flex-start; }
.lt h1 { font-size: 1.6rem; }
.tabs { display: flex; gap: .35rem; overflow-x: auto; padding-bottom: .25rem; scrollbar-width: thin; }
.tab { display: inline-flex; align-items: center; gap: .4rem; white-space: nowrap; min-height: 38px; padding: .3rem .75rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .85rem; color: var(--muted); }
.tab span { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--surface2); font-size: .7rem; font-family: var(--font-mono); }
.tab.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.tab.ok { color: var(--ok); }
.tab .ic { width: 16px; height: 16px; stroke-width: 3; }
.lnav { display: flex; justify-content: space-between; gap: .6rem; }
.plan { margin: 0; padding-left: 1.2rem; columns: 2; color: var(--muted); }
.checks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: .5rem; }
.checks li { display: flex; align-items: center; gap: .6rem; padding: .5rem .7rem; background: var(--surface2); border-radius: 10px; }
.checks li > span { flex: 1; }
.checks li.ok { color: var(--ok); }
.checks .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); display: block; margin: 2px; }
.seg + #exh, .seg ~ #exh { margin-top: .2rem; }
.caption { min-height: 1.5em; color: var(--muted); }
.vpiano { margin-bottom: .2rem; }
.staff { max-width: 100%; height: auto; color: var(--fg, currentColor); display: block; margin: 0 auto; }
.staff .st-col.cur { color: var(--accent); }
.staff .st-col.ok { color: var(--ok); }
.staff .st-col.bad { color: #C0392B; }
.vstaff, .qstaff, .exstaff { background: var(--card, transparent); border: 1px solid var(--line); border-radius: 12px; padding: .5rem; margin: .4rem 0 .6rem; overflow-x: auto; }
.exstaff { border: 0; background: transparent; padding: .2rem; }
.vstaff:empty, .qstaff:empty { display: none; }
.sb-line { overflow-x: auto; }
.sb-sheet { padding: .4rem .6rem; }
.sb-item { display: flex; justify-content: space-between; align-items: center; gap: .8rem; padding: .7rem 0; border-top: 1px solid var(--line); list-style: none; }
.sb-item:first-child { border-top: 0; }
.sb-item p { margin: .1rem 0; }


.cik { display: flex; flex-direction: column; gap: .4rem; }

/* ---------- piano ---------- */
.kbcard { padding: .75rem; }
.kb-scroll { overflow-x: auto; border-radius: 10px; scrollbar-width: thin; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
.kb { position: relative; display: flex; min-width: calc(var(--n) * var(--minkey)); width: 100%; touch-action: pan-x; user-select: none; -webkit-user-select: none; background: var(--key-black); padding: 6px 2px 2px; border-radius: 10px; }
.kb.ro { min-width: calc(var(--n) * var(--minkey)); }
.wk { flex: 1 1 0; min-width: 0; position: relative; background: var(--key-white); border: 1px solid var(--key-white-edge); border-radius: 0 0 6px 6px; margin: 0 1px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 6px; gap: 3px; transition: background .06s; }
.bk { position: absolute; top: 6px; height: 60%; background: var(--key-black); border: 1px solid #000; border-radius: 0 0 5px 5px; z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 5px; gap: 2px; box-shadow: 0 2px 3px rgba(0, 0, 0, .35); }
.bk .lab { color: #F2F1EC; }
.lab { font-size: .68rem; font-weight: 700; color: #4A4B52; font-family: var(--font-body); pointer-events: none; line-height: 1; min-height: .7rem; }
.fin { pointer-events: none; font-style: normal; width: 20px; height: 20px; border-radius: 50%; background: var(--fg); color: var(--bg); font-size: .72rem; font-weight: 800; display: grid; place-items: center; }
.wk.hint { background: var(--key-hint); border-color: var(--accent); }
.wk.hint .lab { color: var(--fg); }
.bk.hint { background: var(--accent); border-color: var(--accent); }
.bk.hint .lab { color: var(--accent-fg); }
.wk.on { background: var(--key-on); }
.bk.on { background: var(--key-on); }

  } else if (type === 'melody') {
    const m = pick(MELODIES, rng);
    const opts = shuffle(MELODIES, rng);
    q.prompt = 'Which tune is this?';
    q.options = opts.map(x => x.name); q.answer = opts.indexOf(m);
    q.events = seqEvents(m.notes.slice(0, 8).map(midiOf), 0.8); q.bpm = 100;
    q.explain = 'That was ' + m.name + '.';
  } else if (type === 'echo') {
    const len = level + 2;
    const pent = [0, 2, 4, 7, 9]; const base = 60;

      let m; do { m = base + pick(pent, rng) + (rng() < 0.3 ? 12 : 0); } while (m === last && pent.length > 1);

    q.explain = 'The notes were ' + midis.map(m => fmt(pcName(m))).join(' – ') + '.';
  }
  return q;
}

const EN = root.Engine;
const sc = (r, t, o) => EN.scaleTokens(r, t, o || 4);
const FM = (toks, f) => { const m = {}; toks.forEach((k, i) => { m[k] = f[i]; }); return m; };
const RHF = [1, 2, 3, 1, 2, 3, 4, 5];
const FING = { C: RHF, G: RHF, D: RHF, A: RHF, E: RHF, B: RHF, F: [1, 2, 3, 4, 1, 2, 3, 4], Bb: [4, 1, 2, 3, 1, 2, 3, 4], Eb: [3, 1, 2, 3, 4, 1, 2, 3], Ab: [3, 4, 1, 2, 3, 1, 2, 3], Db: [2, 3, 1, 2, 3, 4, 1, 2], 'F#': [2, 3, 4, 1, 2, 3, 1, 2] };

const SR = [60, 84];
const rev = a => a.slice().reverse();
const upEx = (r, t, f, o) => Object.assign({ type: 'seq', notes: sc(r, t), fingers: f, hints: true, range: SR }, o || {});
const downEx = (r, t, f, o) => Object.assign({ type: 'seq', notes: rev(sc(r, t)), fingers: rev(f), hints: true, range: SR }, o || {});
const bothEx = (r, t, f, o) => Object.assign({ type: 'seq', notes: sc(r, t).concat(rev(sc(r, t)).slice(1)), fingers: f.concat(rev(f).slice(1)), hints: true, range: SR }, o || {});
const scStep = (r, t, f, caption) => ({ caption, hi: sc(r, t), fingers: FM(sc(r, t), f) });
const heard = (r, t, d) => ({ label: r + ' ' + t, spec: { kind: 'notes', notes: sc(r, t), d: d || 0.45 } });
const diaTargets = (key, degs, sev, labels, bass) => EN.progressionChords(key, degs, sev).map((c, i) => Object.assign({ root: c.root, quality: c.quality }, bass === false ? {} : { bass: true }, labels ? { label: labels[i] } : {}));
const chExs = (key, degs, sev, labels, o) => Object.assign({ type: 'chord', range: [48, 72], targets: diaTargets(key, degs, sev, labels), hints: true }, o || {});

M.push({

    'To analyse a chord, find the key, then count to the chord root. In A major (A B C♯ D E F♯ G♯), the chord D is IV, E is V, F♯m is vi.',
    'The same numerals describe any key: I – IV – V – I is A, D, E, A in A major and F, B♭, C, F in F major.',

H.push({
  id: 'g-tritone-sub', cat: 'Passing chords', title: 'Tritone substitution', minutes: 14, req: ['g-secondary-dominants'],
  why: 'The tritone substitution gives you a chromatic bass line and a surprise that still sounds right. It is a signature of sophisticated gospel playing.',
  objective: 'Replace a V7 chord with the dominant 7th a tritone away and resolve it by half step.',
  theory: [
    'You know that G7 contains B and F, a tritone. Now find another dominant 7th chord containing the same two notes. D♭7 is D♭ F A♭ C♭. C♭ sounds the same as B, so D♭7 also contains F and B.',
    'The two chords share the tritone but swap roles: B is the 3rd of G7 and the 7th of D♭7, and F is the 7th of G7 and the 3rd of D♭7. That is why they can replace each other.',
    'A tritone is six half steps, so the substitute is always six half steps from the original: G7 becomes D♭7, C7 becomes G♭7, D7 becomes A♭7.',
    'The payoff is in the bass: Dm7, D♭7, Cmaj7 gives a bass line D, D♭, C that descends by half step. The harmony is richer and the bass line is smooth.'

    { caption: 'G7: G B D F.', chord: { root: 'G', quality: '7', oct: 4 } },
    { caption: 'D♭7: D♭ F A♭ C♭. It shares the notes F and B (as C♭) with G7.', chord: { root: 'Db', quality: '7', oct: 4 } },
    { caption: 'Cmaj7: D♭7 resolves down to it. The bass moves D♭ to C.', chord: { root: 'C', quality: 'maj7', oct: 4 } }
  ] },
  listen: [
    { label: 'Dm7, G7, Cmaj7', spec: kchords([cT('D', 'm7', { bass: true }), cT('G', '7', { bass: true }), cT('C', 'maj7', { bass: true })], { d: 1.8 }) },
    { label: 'Dm7, D♭7, Cmaj7 (tritone substitution)', spec: kchords([cT('D', 'm7', { bass: true }), cT('Db', '7', { bass: true }), cT('C', 'maj7', { bass: true })], { d: 1.8 }) }
  ],
  play: cExs([bassCh('D', 'm7', { label: 'ii' }), bassCh('Db', '7', { label: '♭II7' }), bassCh('C', 'maj7', { label: 'I' })], 'Play Dm7, D♭7, Cmaj7. The bass steps down D, D♭, C.'),
  practice: [
    cExs([bassCh('G', 'm7', { label: 'ii' }), bassCh('Gb', '7', { label: '♭II7' }), bassCh('F', 'maj7', { label: 'I' })], 'In F: Gm7, G♭7, Fmaj7.'),
    cExs([bassCh('A', 'm7', { label: 'ii' }), bassCh('Ab', '7', { label: '♭II7' }), bassCh('G', 'maj7', { label: 'I' })], 'In G: Am7, A♭7, Gmaj7.')

    q('What does the bass do in Dm7 – D♭7 – Cmaj7?', ['It descends by half steps: D, D♭, C', 'It jumps a fifth', 'It stays on D', 'It rises by thirds'], 0, 'Chromatic descent in the bass.'),
    q('What is the tritone substitution for C7?', ['G♭7', 'F7', 'B♭7', 'D7'], 0, 'C up or down six half steps is G♭.'),

H.push({

  theory: [

WL.push({

    'The third job is space. Play less when the singer sings, and more in the gaps between lines. The melody belongs to the voice; do not double it loudly.',

WL.push({

  objective: 'Play one chord three ways, soft, medium and full, to build intensity.',
  theory: [
    'Intensity comes from four things: volume, register, thickness and rhythm. You can raise any of them without changing the chord.',
    'Soft: a simple triad in the middle of the keyboard. Medium: add the low root and 5th and double the top note. Full: add octaves in the bass, spread the right hand wide and play with weight.',
    'In C: soft is C4 E4 G4. Medium is C3 G3 C4 E4 G4. Full is C2 C3 G3 C4 E4 G4 C5, with the bass an octave doubled and the top an octave higher.',

WL.push({
  id: 'w-sus-lift', cat: 'Playing for worship', title: 'Sus chords and the lift', minutes: 12, req: ['w-pads', 'sus-chords'],
  why: 'Sus chords hang in the air. Resolving them at the right moment creates the feeling of a prayer being answered.',
  objective: 'Play sus2 and sus4 chords and resolve each to a major chord.',
  theory: [
    'A suspended chord replaces the 3rd with the 2nd (sus2) or the 4th (sus4). Without the 3rd it is neither major nor minor, so it sounds open and waiting.',
    'Resolving a sus4 to major is a small step: the 4th drops by a half step to the 3rd. Csus4 (C F G) resolves to C (C E G). Gsus4 resolves to G.',
    'Use the sus as a held moment: stay on Csus4 while the leader prays, or while the singer holds a long note, then let it fall to the major chord at the end of the phrase.',
    'Do not overuse it. The resolution only feels special if you made the listener wait.'
  ],

  play: cExs([bassCh('C', 'sus4'), bassCh('C', 'major'), bassCh('F', 'sus4'), bassCh('F', 'major')], 'Play Csus4 to C, then Fsus4 to F.'),

  challenge: cExs([bassCh('C', 'sus2'), bassCh('C', 'major'), bassCh('G', 'sus4'), bassCh('G', 'major'), bassCh('A', 'sus4'), bassCh('A', 'minor')], 'Challenge: Csus2, C, Gsus4, G, Asus4, Am, no hints.', { hints: false }),

    q('Why do sus chords feel open?', ['They have no 3rd, so neither major nor minor', 'They are loud', 'They are always high', 'They have extra bass'], 0, 'The 3rd defines the quality.'),

WL.push({

  theory: [

    'Common vamps in G: I – IV (G, C), I – V (G, D), I – IV – V (G, C, D) and vi – IV – I – V (Em, C, G, D).',
    'Within a vamp, change one thing at a time: the volume, the register, a bass walk or a fill. Never change everything together.',

WL.push({

WL.push({

  objective: 'Find a key by ear, follow a leader\'s tempo, and switch keys quickly.',
  theory: [
    'Listen first, play second. The leader sets the key, the tempo and the mood. In the first four bars, find the key by ear: hum the first sung note, find it on the piano, and test whether it is I, III or V.',

SL.push({

PL.push({
  id: 'p-midi', cat: 'Foundations', title: 'MIDI: notes as data', minutes: 13, req: ['p-daw'],
  why: 'MIDI is the language between your keyboard and every virtual instrument. Understanding it lets you edit a performance after you play it.',
  objective: 'Explain note, velocity, length and quantize, and play MIDI-style note patterns accurately.',
  theory: [
    'MIDI does not record sound. It records instructions: which note, when it starts, how long it lasts, and how hard it was played (velocity, from 1 to 127). A virtual instrument turns those instructions into sound.',
    'Because MIDI is data, you can fix mistakes without playing again: change a wrong note, move a note in time, change its length or velocity, or swap the sound entirely. Audio cannot be changed so freely.',
    'Quantize snaps notes to the grid. Full quantize can sound robotic; use partial quantize or leave it off on emotional piano parts. Human timing is part of the feeling.',
    'In the app, middle C is MIDI note 60. The 88 keys of a piano are notes 21 to 108. Your keyboard sends velocity as well, so play with real dynamics: gentle on verses, firm on choruses.'
  ],
  listen: [{ label: 'The same notes, gently then firmly', spec: { kind: 'notes', notes: ['C4', 'E4', 'G4', 'C5', 'G4', 'E4', 'C4'], d: 0.4 } }],
  play: sEx(['C4', 'E4', 'G4', 'C5'], 'Play a simple MIDI part: C E G C.', { range: [60, 84] }),
  practice: [sEx(['C4', 'E4', 'G4', 'C5', 'G4', 'E4', 'C4'], 'Up and back down: C E G C G E C.', { range: [60, 84] })],
  apply: { text: 'In your DAW, record the notes you just played with a piano instrument. Open the piano roll and look at each note. Move one note off the grid and then quantize it back. Change the velocity of one note and listen.' },
  challenge: sEx(['E4', 'G4', 'C5', 'G4', 'E4', 'D4', 'F4', 'A4', 'F4', 'D4'], 'Challenge: E G C G E, then D F A F D, no hints.', { hints: false, range: [60, 84] }),
  quiz: [
    q('What does MIDI record?', ['Instructions: note, timing, length and velocity', 'The actual sound', 'The room acoustics', 'Only lyrics'], 0, 'It is data, not sound.'),
    q('What is velocity?', ['How hard a note was played', 'How fast the song is', 'The note length', 'The volume knob'], 0, 'A value from 1 to 127.'),
    q('What does quantize do?', ['Snaps notes to the grid', 'Raises the pitch', 'Adds reverb', 'Records audio'], 0, 'Use it gently on expressive parts.'),
    q('What is MIDI note 60?', ['Middle C', 'The lowest key', 'The highest key', 'A sharp'], 0, 'C4 in this app.')
  ]

PL.push({

PL.push({
  id: 'p-record-piano', cat: 'Recording', title: 'Recording piano', minutes: 14, req: ['p-instruments', 'p-daw'],
  why: 'A good recording starts at the source: a relaxed performance, in time, captured clean.',
  objective: 'Prepare a take: count in, play against the click, keep the chords even, and know how to choose between takes.',
  theory: [
    'Before recording, set the tempo, turn on a count-in of one bar, check your sound, and set the input level. If you record MIDI, there is no level problem. If you record audio (an acoustic piano, a microphone), watch the meter: peaks around −12 to −6 dB, never reaching 0 dB (clipping).',
    'Play the whole song, not tiny pieces, so it feels like music. Record several takes. Do not stop for small errors: finish the take and compare afterwards.',
    'Play with the click, but listen to yourself. Keep your chords even in volume. Rushing is common when nervous: if you speed up, slow down and relax your shoulders.',
    'Choose the best take by feel, not perfection. Fix small mistakes by editing MIDI notes or by combining the best parts of different takes (comping).'

    q('Why record the whole song?', ['It feels like music, not pieces', 'It is faster', 'It saves storage', 'No reason'], 0, 'Flow matters.'),

PL.push({

  objective: 'Describe a basic gospel drum pattern and tap the kick and hi-hat rhythms in time.',
  theory: [
    'The core of a drum kit is the kick (low, on strong beats), the snare (sharp, on beats 2 and 4, the backbeat) and the hi-hat (steady pulse, often eighth notes). Add toms for fills and cymbals for crashes at section changes.',
    'A basic 4/4 pattern: kick on beats 1 and 3, snare on 2 and 4, hi-hat on every eighth note. Slow gospel ballads often use a 6/8 feel with a kick on 1, a snare on 4 of six, and hi-hat on every eighth note.',
    'In your DAW, program drums on a grid of 16 steps per bar (sixteenth notes). Start simple. Then vary the velocity: soft hi-hats on the off-beats, firm on the beats. Add a fill at the end of every four or eight bars.',
    'Drums should serve the song: sparse in verses, fuller in the chorus. Silence is a drum fill too.'
  ],
  listen: [{ label: 'Eighth-note pulse (the hi-hat)', spec: { kind: 'rhythm', pattern: e8, bpm: 80, note: 76 } }, { label: 'Kick on 1, the "and" of 2, and 4', spec: { kind: 'rhythm', pattern: [1.5, 1.5, 1], bpm: 80, note: 48 } }],

  apply: { text: 'Program a one-bar pattern in your DAW with kick on 1 and 3, snare on 2 and 4 and hi-hat in eighths. Loop it. Then lower the velocity of every second hi-hat note and hear the groove breathe.' },

    q('How many steps are in a one-bar 16-step grid?', ['16 sixteenth notes', '8 quarter notes', '4 eighth notes', '32 beats'], 0, 'Four per beat, four beats.'),

PL.push({
  id: 'p-groove', cat: 'Rhythm section', title: 'Groove, swing and feel', minutes: 13, req: ['p-drums', 'comping-rhythms'],

  objective: 'Describe how velocity, swing and timing create feel, and tap syncopated rhythms in time.',
  theory: [
    'Groove is the feel of the rhythm. It comes from three things: velocity (some notes louder), timing (some notes slightly early or late) and length (short or long notes).',
    'Swing delays the off-beat eighth notes so each pair feels like long-short. Straight eighths are even. Swing amount is a percentage: 50% is straight, around 60-66% feels like a shuffle. Try small amounts; too much sounds sloppy.',
    'Humanize by shifting a few notes a few milliseconds and varying velocities slightly. Keep the kick and snare steady; loosen the hi-hat and shakers.',
    'Gospel groove often leans on syncopation: playing on the off-beat before a strong beat. This is the "push" you practised in comping rhythms.'
  ],
  listen: [{ label: 'Straight eighths', spec: { kind: 'rhythm', pattern: e8, bpm: 90, note: 60 } }, { label: 'A syncopated push', spec: { kind: 'rhythm', pattern: [1.5, 0.5, 1, 1, 1.5, 0.5, 1, 1], bpm: 90, note: 60 } }],
  play: tp(80, [1.5, 0.5, 1, 1], 'Tap the push: dotted quarter, eighth, quarter, quarter.'),
  practice: [tp(90, [0.5, 1, 0.5, 1, 1, 0.5, 1, 0.5], 'Tap an off-beat pattern at 90 BPM.')],
  apply: { text: 'Take your programmed pattern and move every second hi-hat slightly late, and lower its velocity. Then compare to the rigid version. Which one would you rather play along to?' },
  challenge: tp(100, [1.5, 0.5, 1, 1, 0.5, 1, 0.5, 1.5, 1], 'Challenge: a longer syncopated pattern at 100 BPM, no hints.', { tol: 0.15 }),
  quiz: [
    q('Which three things create groove?', ['Velocity, timing and note length', 'Key, pitch and volume only', 'Reverb, delay and EQ', 'Tempo, key and lyrics'], 0, 'Small variations make it human.'),
    q('What does swing do?', ['Delays the off-beat eighths', 'Raises the pitch', 'Doubles the tempo', 'Removes the kick'], 0, 'Long-short pairs.'),
    q('What is syncopation?', ['Emphasis on off-beats', 'Playing on every beat', 'Silence', 'A key change'], 0, 'Playing between the beats.'),
    q('What should you keep steady when humanizing?', ['Kick and snare', 'Everything is random', 'Nothing', 'Only the hi-hat'], 0, 'Anchor the groove.')
  ]
});

PL.push({

/* ---------- derived structure ---------- */
const byId = {};
LESSONS.forEach(l => { byId[l.id] = l; });
const order = [];
MODULES.forEach(m => m.lessons.forEach(id => order.push(id)));
MODULES.forEach((m, mi) => {
  m.lessons.forEach((id, i) => {
    const l = byId[id];
    l.module = m.id; l.level = m.level; l.index = i;
    if (!l.req) l.req = i > 0 ? [m.lessons[i - 1]] : [];
  });
});

/* a content check the build runs: returns a list of problems */
function validate(Engine) {
  const errs = [];
  const seen = new Set();
  LESSONS.forEach(l => {
    if (seen.has(l.id)) errs.push('duplicate id ' + l.id); seen.add(l.id);
    if (!order.includes(l.id)) errs.push(l.id + ' is not in a module');
    (l.req || []).forEach(r => { if (!byId[r]) errs.push(l.id + ' requires unknown ' + r); });
    ['objective', 'why'].forEach(k => { if (!l[k]) errs.push(l.id + ' missing ' + k); });
    if (!l.theory || !l.theory.length) errs.push(l.id + ' missing theory');
    if (!l.play) errs.push(l.id + ' missing play');

}

/* ---------------------------------------------------------------- quiz */
function Quiz(host, questions, cfg) {

  const cleanups = [];

    const src = cfg.getQuestions ? cfg.getQuestions() : questions;
    qs = (cfg.shuffleQuestions ? E.shuffle(src) : src).map(q => {
      const opts = q.o.map((t, k) => ({ t, k }));
      return Object.assign({}, q, { opts: q.o.length > 2 ? E.shuffle(opts) : opts });
    });
    i = 0; picked = null; correct = 0; answers = []; moveFocus = false; draw();
  }
  function stopAudio() { Snd.stopAll(); }
  function draw() {
    if (piano) { piano.destroy(); piano = null; }
    stopAudio();
    const q = qs[i];
    if (!q) { result(); return; }
    const answered = picked !== null;
    host.innerHTML =
      '<div class="quiz"><div class="quiz-top"><span class="tiny">Question ' + (i + 1) + ' of ' + qs.length + '</span><div class="bar"><i style="width:' + Math.round(i / qs.length * 100) + '%"></i></div></div>' +
      '<h3 class="qtext">' + esc(q.q) + '</h3>' +
      (q.listen ? '<button class="btn soft" type="button" data-q="listen">' + icon('play') + 'Play sound</button>' : '') +
      (q.staff ? '<div class="qstaff">' + Staff.render(q.staff) + '</div>' : '') +
      (q.show ? '<div class="qpiano"></div>' : '') +
      '<div class="opts" role="group" aria-label="Answers">' +
      q.opts.map((o, n) => '<button type="button" class="opt' + (answered ? (o.k === q.a ? ' right' : n === picked ? ' wrong' : '') : '') + '" data-pick="' + n + '"' + (answered ? ' disabled' : '') + '>' + esc(o.t) + (answered ? (o.k === q.a ? '<span class="sr-only"> (correct answer)</span>' : n === picked ? '<span class="sr-only"> (your answer, not correct)</span>' : '') : '') + '</button>').join('') +
      '</div>' +
      (answered ? '<div class="why ' + (q.opts[picked].k === q.a ? 'ok' : 'bad') + '" role="status" tabindex="-1"><b>' + (q.opts[picked].k === q.a ? 'Correct. ' : 'Not quite. ') + '</b>' + esc(q.why) + '</div><button class="btn primary" type="button" data-q="next">' + (i + 1 >= qs.length ? 'See result' : 'Next question') + '</button>' : '') +
      '</div>';
    if (q.show) { piano = Piano($('.qpiano', host), { lo: q.show.range[0], hi: q.show.range[1], names: true, readonly: true, height: 110, base: false }); piano.hint({ pcs: q.show.hi.map(t => E.parseToken(t).pc) }); }

    }
    moveFocus = true;
  }
  function result() {
    const pct = Math.round(100 * correct / qs.length);
    host.innerHTML = '<div class="quiz result"><div class="score">' + pct + '<small>%</small></div><p><b>' + correct + ' of ' + qs.length + ' correct.</b> ' +
      (cfg.passMark ? (pct >= cfg.passMark ? 'You passed.' : 'You need ' + cfg.passMark + '% to pass. Review the lesson and try again.') : '') + '</p>' +
      (cfg.resultExtra ? cfg.resultExtra(pct) : '') +
      '<div class="row">' + (cfg.noRetry ? '' : '<button class="btn ghost" type="button" data-q="retry">Try again</button>') + (cfg.nextHtml ? cfg.nextHtml(pct) : '') + '</div></div>';

    const q = qs[i];
    if (b.dataset.pick !== undefined && picked === null) {

/* ---------------------------------------------------------------- listen list */

    '<label class="switch"><input type="checkbox" data-l="loop"><span>Loop</span></label></div>' +

  }

/* ---------------------------------------------------------------- backup: export and import progress */
const BACKUP_APP = 'gospel-piano-academy';
const BACKUP_MAX_BYTES = 5 * 1024 * 1024;
const DANGEROUS_KEYS = new Set(['__proto__', 'constructor', 'prototype']);
function backupSummary(st) {
  const lessons = st.lessons && typeof st.lessons === 'object' ? Object.values(st.lessons) : [];
  return {
    name: (st.profile && st.profile.name) || '',
    xp: Number(st.xp) || 0,

    mastered: lessons.filter(r => r && r.status === 'mastered').length,
    minutes: Math.round(((st.practice && st.practice.total) || 0) / 60),
    songs: Array.isArray(st.songs) ? st.songs.length : 0,
    updated: st.updated || 0

}
function exportProgress() {
  saveNow();
  const payload = { app: BACKUP_APP, format: 1, exportedAt: new Date().toISOString(), state: S };
  const day = E.dateStr();
  const who = (S.profile.name || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const fileName = 'gospel-piano-academy-progress' + (who ? '-' + who : '') + '-' + day + '.json';
  try {
    const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    S.events.lastBackup = Date.now(); touch();
    toast('Backup saved: ' + fileName);
    if (route && (route.name === 'profile' || route.name === 'home')) render();
  } catch (e) { toast('Could not create the backup file.', 'warn'); }
}
function parseBackup(text) {
  if (typeof text !== 'string' || !text.trim()) return { ok: false, msg: 'That file is empty.' };
  let obj;
  try { obj = JSON.parse(text, (k, v) => (DANGEROUS_KEYS.has(k) ? undefined : v)); }
  catch (e) { return { ok: false, msg: 'That is not a valid backup file (it could not be read as JSON).' }; }
  const st = obj && obj.app === BACKUP_APP && obj.state ? obj.state : (obj && obj.lessons && obj.profile ? obj : null);
  if (!st || typeof st !== 'object' || Array.isArray(st)) return { ok: false, msg: 'This file is not a Gospel Piano Academy backup.' };
  if (typeof st.v === 'number' && st.v > 1) return { ok: false, msg: 'This backup was made by a newer version of the app. Update the app first.' };
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  for (const k of ['lessons', 'cats', 'ear', 'ach', 'testouts', 'recommend', 'events', 'profile', 'practice', 'prefs', 'today', 'sprint', 'review', 'sight', 'songbook']) {
    if (st[k] !== undefined && !isObj(st[k])) return { ok: false, msg: 'The backup is damaged (“' + k + '” has the wrong shape).' };
  }
  for (const k of ['songs', 'scores']) { if (st[k] !== undefined && !Array.isArray(st[k])) return { ok: false, msg: 'The backup is damaged (“' + k + '” has the wrong shape).' }; }
  if (st.xp !== undefined && !(Number.isFinite(st.xp) && st.xp >= 0)) return { ok: false, msg: 'The backup is damaged (XP is not a valid number).' };
  if (st.practice && st.practice.days !== undefined && !isObj(st.practice.days)) return { ok: false, msg: 'The backup is damaged (practice history).' };
  return { ok: true, state: st, summary: backupSummary(st), exportedAt: obj.exportedAt || '' };
}
function readBackupFile(file) {
  if (!file) return;
  if (file.size > BACKUP_MAX_BYTES) { ui.importMsg = 'That file is too large to be a backup.'; ui.importPending = null; render(); return; }
  const fr = new FileReader();
  fr.onload = () => {
    const r = parseBackup(String(fr.result || ''));
    if (r.ok) { ui.importPending = r; ui.importMsg = ''; } else { ui.importPending = null; ui.importMsg = r.msg; }
    render();
  };
  fr.onerror = () => { ui.importPending = null; ui.importMsg = 'The file could not be read.'; render(); };
  fr.readAsText(file);
}
function applyImport() {
  const pend = ui.importPending; if (!pend || !pend.ok) return;

/* ---------------------------------------------------------------- sight-reading drill */
const SIGHT_LEVELS = [
  null,
  { label: 'Treble clef, five notes', clef: 'treble', key: 0, pool: ['C4', 'D4', 'E4', 'F4', 'G4'], range: [60, 72], phrase: 4, walk: 2 },
  { label: 'Bass clef, five notes', clef: 'bass', key: 0, pool: ['C3', 'D3', 'E3', 'F3', 'G3'], range: [48, 60], phrase: 4, walk: 2 },
  { label: 'Both clefs around middle C', clef: 'grand', key: 0, pool: ['E3', 'F3', 'G3', 'A3', 'B3', 'C4', 'D4', 'E4', 'F4', 'G4', 'A4'], range: [48, 72], phrase: 4, walk: 2 },
  { label: 'Treble clef in G major', clef: 'treble', key: 1, pool: ['G4', 'A4', 'B4', 'C5', 'D5', 'E5', 'F#5'], range: [65, 79], phrase: 4, walk: 3 },
  { label: 'Both clefs in F major', clef: 'grand', key: -1, pool: ['F3', 'G3', 'A3', 'Bb3', 'C4', 'D4', 'E4', 'F4', 'G4'], range: [48, 72], phrase: 5, walk: 3 },
  { label: 'Both clefs in D major', clef: 'grand', key: 2, pool: ['D3', 'E3', 'F#3', 'G3', 'A3', 'B3', 'C#4', 'D4', 'E4', 'F#4', 'G4', 'A4', 'B4'], range: [48, 72], phrase: 5, walk: 4 }

function mountSight(host) {
  const sg = S.sight, cleanups = [];
  let mount = null;
  function round() {
    if (mount) { mount.destroy(); mount = null; }
    const lv = clamp(sg.level || 1, 1, SIGHT_LEVELS.length - 1), spec = SIGHT_LEVELS[lv];
    host.innerHTML = '<p class="tiny">Level ' + lv + ' of ' + (SIGHT_LEVELS.length - 1) + ': ' + esc(spec.label) + '. Keep going even if you slip. Strong rounds move you up a level.</p><div id="sgx"></div>';
    const count = 3;
    mount = mountExercise($('#sgx', host), Object.assign({ type: 'read', count, prompt: 'Read each phrase and play it from left to right.' }, spec), {
      hints: false, height: 130,
      onDone: r => {
        const notes = count * spec.phrase, acc = Math.max(0, (notes - r.miss) / notes);
        sg.sessions = (sg.sessions || 0) + 1; sg.notes = (sg.notes || 0) + notes; sg.correct = (sg.correct || 0) + Math.max(0, notes - r.miss);
        let msg;
        if (acc >= 0.9 && lv < SIGHT_LEVELS.length - 1) { sg.level = lv + 1; msg = 'Strong round. Moving up to level ' + sg.level + '.'; }
        else if (acc < 0.6 && lv > 1) { sg.level = lv - 1; msg = 'That was tough. Going back to level ' + sg.level + ' to build speed.'; }
        else msg = acc >= 0.9 ? 'You have reached the top level. Keep the habit going.' : 'Good work. Same level again.';
        sg.best = Math.max(sg.best || 0, lv);
        const today = E.dateStr();
        if (sg.last !== today) { sg.last = today; award(10, 'sight-reading'); }
        touch();
        const box = $('#sgx', host); if (box) box.insertAdjacentHTML('beforeend', '<div class="callout"><p><b>' + Math.round(acc * 100) + '% accurate.</b> ' + esc(msg) + '</p><button class="btn primary" type="button" data-sg="again">Next round</button></div>');
      }
    });
    mount.restart();
  }
  host.addEventListener('click', e => { if (e.target.closest('[data-sg="again"]')) round(); });
  round();
  return { destroy() { if (mount) mount.destroy(); cleanups.forEach(f => f()); } };
}

function mountEar(host, type) {
  const T = E.EAR_TYPES[type], rec = S.ear[type] || (S.ear[type] = { correct: 0, total: 0, level: 1, sessions: 0 });
  const N = 8; let i = 0, ok = 0, q = null, answered = false, piano = null, slow = false, eidx = 0, emiss = 0, picked = -1, edone = false;
  const cleanups = [];
  function stopPiano() { if (piano) { piano.destroy(); piano = null; } }
  function playQ() { if (!q) return; Snd.play({ events: q.events, bpm: q.bpm, total: q.events.reduce((a, e) => Math.max(a, e.t + e.d), 0) }, { speed: slow ? 0.65 : 1 }); }
  function nextQ() {
    q = E.earQuestion(type, rec.level); answered = false; picked = -1; eidx = 0; emiss = 0; edone = false;
    drawQ(); setTimeout(playQ, 150);
  }
  function drawQ() {
    stopPiano();
    const top = '<div class="quiz-top"><span class="tiny">Question ' + (i + 1) + ' of ' + N + ' · Level ' + rec.level + '</span>' + bar(Math.round(i / N * 100)) + '</div>';
    const ctl = '<div class="row wrap"><button class="btn soft" type="button" data-e="play">' + icon('replay') + 'Play again</button><label class="switch"><input type="checkbox" data-e="slow"' + (slow ? ' checked' : '') + '><span>Slow</span></label></div>';
    if (type === 'echo') {
      host.innerHTML = '<div class="quiz">' + top + '<h3 class="qtext">' + esc(q.prompt) + '</h3>' + ctl + '<div class="ex-dots">' + q.echo.map((n, k) => '<span class="pill' + (k < eidx ? ' done' : k === eidx && !edone ? ' cur' : '') + '"></span>').join('') + '</div><div id="ep"></div><p class="ex-fb' + (answered ? '' : '') + '" role="status" aria-live="polite" id="efb"></p></div>';
      piano = Piano($('#ep', host), { lo: 60, hi: 84, names: S.prefs.names, height: 140 });
      return;
    }
    host.innerHTML = '<div class="quiz">' + top + '<h3 class="qtext">' + esc(q.prompt) + '</h3>' + ctl + (q.show ? '<div class="qpiano" id="ep"></div>' : '') +
      '<div class="opts">' + q.options.map((o, n) => '<button type="button" class="opt' + (answered ? (n === q.answer ? ' right' : n === picked ? ' wrong' : '') : '') + '" data-e="pick" data-n="' + n + '"' + (answered ? ' disabled' : '') + '>' + esc(o) + '</button>').join('') + '</div>' +
      (answered ? '<div class="why ' + (picked === q.answer ? 'ok' : 'bad') + '"><b>' + (picked === q.answer ? 'Correct. ' : 'Not quite. ') + '</b>' + esc(q.explain) + '</div><button class="btn primary" type="button" data-e="next">' + (i + 1 >= N ? 'See result' : 'Next question') + '</button>' : '') + '</div>';
    if (answered && q.show) { piano = Piano($('#ep', host), { lo: 60, hi: 84, names: true, readonly: true, height: 100, base: false }); piano.hint({ midis: q.show }); }
  }
  function answer(correct) {
    answered = true; rec.total++; if (correct) { rec.correct++; ok++; }
    touch();
  }
  function end() {
    stopPiano(); Snd.stopAll();
    const acc = ok / N; let note = '';
    if (acc >= 0.85 && rec.level < T.levels) { rec.level++; note = 'Level up. Next round is level ' + rec.level + '.'; }
    else if (acc < 0.5 && rec.level > 1) { rec.level--; note = 'Next round eases back to level ' + rec.level + ' so you can build confidence.'; }
    else note = 'Staying at level ' + rec.level + '.';
    rec.sessions++; markToday('ear'); award(ok * 2, 'ear training'); touch(); checkAch();
    host.innerHTML = '<div class="quiz result"><div class="score">' + Math.round(acc * 100) + '<small>%</small></div><p><b>' + ok + ' of ' + N + ' correct.</b> ' + esc(note) + '</p><div class="row wrap"><button class="btn primary" type="button" data-e="again">Another round</button><button class="btn ghost" type="button" data-act="pview" data-view="hub">Done</button></div></div>';
  }
  host.addEventListener('click', e => {
    const b = e.target.closest('[data-e]'); if (!b) return;
    const a = b.dataset.e;
    if (a === 'play') playQ();
    if (a === 'pick' && !answered) { picked = +b.dataset.n; answer(picked === q.answer); drawQ(); }
    if (a === 'next') { i++; if (i >= N) end(); else nextQ(); }
    if (a === 'again') { i = 0; ok = 0; nextQ(); }
  });
  host.addEventListener('change', e => { if (e.target.dataset.e === 'slow') slow = e.target.checked; });
  cleanups.push(Input.listen(ev => {
    if (type !== 'echo' || !q || edone) return;
    const want = pcOf(q.echo[eidx]), efb = $('#efb', host);
    if (pcOf(ev.midi) === want) {
      eidx++; piano && piano.ok(ev.midi);
      if (eidx >= q.echo.length) {
        edone = true; const good = emiss <= 1; answer(good);
        $$('.pill', host).forEach(p => p.classList.add('done'));
        if (efb) { efb.className = 'ex-fb ' + (good ? 'ok' : 'bad'); efb.textContent = (good ? 'Correct. ' : 'Completed with several misses. ') + q.explain; }
        host.insertAdjacentHTML('beforeend', '<div class="row"><button class="btn primary" type="button" data-e="next">' + (i + 1 >= N ? 'See result' : 'Next question') + '</button></div>');
      } else { $$('.pill', host).forEach((p, k) => { p.classList.toggle('done', k < eidx); p.classList.toggle('cur', k === eidx); }); }
    } else {
      emiss++; piano && piano.bad(ev.midi);
      if (efb) { efb.className = 'ex-fb bad'; efb.textContent = emiss >= 3 ? 'Listen again. ' : 'Not that one.'; }
      if (emiss === 3) playQ();
    }
  }));
  nextQ();
  return () => { stopPiano(); Snd.stopAll(); cleanups.forEach(f => f()); };
}

function mountSprint(host, kind) {
  const secs = kind === 'note' ? 60 : 90; let score = 0, miss = 0, running = false, left = secs, iv = null, target = null, piano = null, buf = [];
  const best = () => S.sprint[kind];
  function newTarget() {
    if (kind === 'note') { let n; do { n = E.pick(KEY_NAMES.concat(['F#', 'C#'])); } while (target && E.pcOfName(n) === E.pcOfName(target)); target = n; }
    else { let r, qq; do { r = E.pick(KEY_NAMES); qq = E.pick(['major', 'minor']); } while (target && target.root === r && target.q === qq); target = { root: r, q: qq }; }
    buf = [];
  }
  function draw() {
    host.innerHTML = '<div class="sprint"><div class="split"><span class="timer mono" id="tm">' + left + 's</span><span class="tiny">Score <b id="sc">' + score + '</b> · Misses ' + miss + ' · Best ' + best() + '</span></div>' +
      (running ? '<div class="find"><span class="sym mono">' + (kind === 'note' ? esc(fmt(target)) : esc(E.chordSymbol(target.root, target.q))) + '</span>' + (kind === 'chord' ? '<span class="tiny">' + esc(E.chordNames(target.root, target.q).map(fmt).join(' ')) + '</span>' : '') + '</div>' : '<div class="find"><span class="tiny">Press Start when you are ready.</span></div>') +
      '<div id="sp"></div><div class="row wrap">' + (running ? '<button class="btn ghost" data-s="skip">Skip</button><button class="btn ghost" data-s="stop">Finish now</button>' : '<button class="btn primary" data-s="start">Start</button>') + '</div></div>';
    if (piano) piano.destroy();
    piano = Piano($('#sp', host), { lo: 60, hi: 84, names: true, minKey: 38, height: 140 });
  }
  function finish() {
    clearInterval(iv); running = false;
    const isBest = score > best(); if (isBest) S.sprint[kind] = score;
    award(Math.min(40, score * 2), 'sprint'); markToday('warm'); touch();
    host.innerHTML = '<div class="quiz result"><div class="score">' + score + '</div><p><b>' + (kind === 'note' ? 'notes found' : 'chords played') + '.</b> ' + (isBest ? 'New personal best.' : 'Your best is ' + best() + '.') + '</p><div class="row wrap"><button class="btn primary" data-s="start">Go again</button><button class="btn ghost" data-act="pview" data-view="hub">Done</button></div></div>';
  }
  host.addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    if (b.dataset.s === 'start') { score = 0; miss = 0; left = secs; running = true; newTarget(); draw(); clearInterval(iv); iv = setInterval(() => { left--; const t = $('#tm', host); if (t) t.textContent = left + 's'; if (left <= 0) finish(); }, 1000); }
    if (b.dataset.s === 'skip') { newTarget(); draw(); }
    if (b.dataset.s === 'stop') finish();
  });
  const un = Input.listen(ev => {
    if (!running) return;
    if (kind === 'note') {
      if (pcOf(ev.midi) === E.pcOfName(target)) { score++; newTarget(); draw(); } else { miss++; const el = $('#sc', host); if (el && el.parentElement) el.parentElement.lastChild; }
    } else {
      const now = performance.now(); buf = buf.filter(b => now - b.t < 2500); buf.push({ m: ev.midi, t: now });
      const r = E.compareToChord(buf.map(b => b.m), target.root, target.q);
      if (r.status === 'correct') { score++; newTarget(); draw(); } else if (r.extra.length) { miss++; buf = [ { m: ev.midi, t: now } ]; }
    }
  });
  draw();
  return () => { clearInterval(iv); if (piano) piano.destroy(); un(); };
}

function mountMetro(host) {
  let bpm = S.prefs.bpm || 80, bpb = 4, m = null, beat = -1;
  function draw() {

        const out = notes.map((n, i) => ({ m: n.m, t: n.t, d: Math.max(0.5, Math.min(2, (notes[i + 1] ? notes[i + 1].t - n.t : 1.5) || 0.5)) }));
        if (out.length) { P.melody = { notes: out }; touch(); render(); } else { say(); info.textContent = 'No notes were captured. Try again and play after the four clicks.'; }
      } });
    }
    if (a === 'play') {
      if (!P.melody || !P.melody.notes.length) { info.textContent = 'Record a melody first.'; return; }
      const ev = ps.script.events.concat(P.melody.notes.map(n => ({ t: n.t, d: n.d, notes: [n.m], inst: Snd.inst() })));
      Snd.play({ events: ev, bpm: P.bpm, total: bars }, { force: true, inst: () => Snd.backingInst(), onStep: (x, on) => { if (!x.notes || x.notes.length !== 1 || x.notes[0] < 60) return; piano.mark(x.notes[0], on); } });
    }
    if (a === 'clear') { Snd.stopAll(); recording = false; P.melody = null; P.steps.melody = false; touch(); render(); }
  });
  say();
  return { destroy() { un(); piano.destroy(); recording = false; } };
}

/* ---------------------------------------------------------------- PROGRESS */
function viewProgress() {
  const rk = E.rankFor(S.xp), t = ensureToday();
  const done = C.order.filter(isDone).length, mastered = totalMastered();
  const streak = E.streak(S.practice.days, t.date);
  /* 14-day chart */
  const days = Array.from({ length: 14 }, (_, i) => E.addDays(t.date, i - 13));
  const mins = days.map(d => Math.round((S.practice.days[d] || 0) / 60));
  const top = Math.max(S.prefs.dailyMin, ...mins, 10), W = 560, H = 170, pl = 30, pb = 24, bw = (W - pl - 6) / 14;
  const y = v => H - pb - (v / top) * (H - pb - 14);
  const ticks = [0, Math.round(top / 2), top];
  const chart = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" role="img" aria-label="Minutes practised on each of the last 14 days">' +
    ticks.map(v => '<line class="grid" x1="' + pl + '" x2="' + (W - 6) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="axis" x="' + (pl - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>').join('') +
    '<line class="goal" x1="' + pl + '" x2="' + (W - 6) + '" y1="' + y(S.prefs.dailyMin) + '" y2="' + y(S.prefs.dailyMin) + '"/><text class="axis goal-l" x="' + (W - 8) + '" y="' + (y(S.prefs.dailyMin) - 4) + '" text-anchor="end">goal ' + S.prefs.dailyMin + ' min</text>' +
    mins.map((v, i) => '<rect class="barc' + (days[i] === t.date ? ' now' : '') + '" x="' + (pl + i * bw + 3) + '" y="' + y(v) + '" width="' + (bw - 6) + '" height="' + Math.max(0, H - pb - y(v)) + '" rx="2"><title>' + days[i] + ': ' + v + ' min</title></rect>' +
      (i % 2 === 1 || i === 13 ? '<text class="axis" x="' + (pl + i * bw + bw / 2) + '" y="' + (H - 7) + '" text-anchor="middle">' + days[i].slice(8) + '</text>' : '')).join('') + '</svg>';
  /* strengths and weaknesses */
  const cats = Object.keys(S.cats).filter(k => S.cats[k].t >= 3).map(k => ({ k, p: pct(S.cats[k].c, S.cats[k].t), t: S.cats[k].t }));
  Object.keys(S.ear).filter(k => S.ear[k].total >= 5).forEach(k => cats.push({ k: 'Ear · ' + E.EAR_TYPES[k].label, p: pct(S.ear[k].correct, S.ear[k].total), t: S.ear[k].total }));
  cats.sort((a, b) => b.p - a.p);
  const strong = cats.filter(c => c.p >= 85), weak = cats.filter(c => c.p < 70).reverse();
  const skillRows = cats.length ? '<ul class="skills">' + cats.map(c => '<li><span>' + esc(c.k) + '</span>' + bar(c.p, c.p >= 85 ? 'good' : c.p < 70 ? 'warn' : '') + '<b class="tiny">' + c.p + '%</b></li>').join('') + '</ul>' : '<p class="muted">Answer a few assessment or ear-training questions and your strengths and weak spots will appear here.</p>';
  /* skill tree */
  const tree = C.LEVELS.map(L => '<div class="tlevel"><p class="eyebrow">' + esc(L.name) + ' · ' + esc(L.title) + '</p>' + C.MODULES.filter(m => m.level === L.id).map(m =>
    '<div class="station"><div class="snodes">' + m.lessons.map(id => { const st = lessonStatus(id), un = isUnlocked(id); return '<span class="node ' + (un ? st : 'locked') + '" title="' + esc(C.byId[id].title) + ' · ' + (un ? st : 'locked') + '"></span>'; }).join('<s></s>') + '</div><div><b>' + esc(m.title) + '</b><span class="tiny">' + m.lessons.filter(isDone).length + ' of ' + m.lessons.length + ' complete</span></div></div>').join('')).join('') +
    '<div class="tlevel planned"><p class="eyebrow">Planned</p>' + C.ROADMAP.map(r => '<div class="station"><div class="snodes"><span class="node planned"></span></div><div><b>' + esc(r.track) + '</b><span class="tiny">Not playable yet</span></div></div>').join('') + '</div>';
  const ach = ACH.map(a => '<li class="badge' + (S.ach[a.id] ? ' got' : '') + '"><span class="bico">' + icon(S.ach[a.id] ? 'star' : 'lock') + '</span><div><b>' + esc(a.name) + '</b><span class="tiny">' + esc(a.desc) + '</span></div></li>').join('');
  const scores = S.scores.slice(-8).reverse();
  const projDone = S.songs.filter(s => s.done).length;
  const html = '<div class="screen"><div class="pagehead"><h1>Progress</h1></div>' +
    '<section class="card hero-card"><div class="split"><div><p class="eyebrow">Rank ' + rk.level + '</p><h2>' + esc(rk.name) + '</h2></div><div class="bigxp"><b>' + S.xp + '</b><span class="tiny">XP</span></div></div>' + bar(rk.pct) + '<p class="tiny">' + (rk.next ? (rk.next - S.xp) + ' XP to ' + esc(rk.nextName) : 'Top rank reached') + '</p></section>' +
    '<section class="kpis"><div class="kpi"><b>' + done + '<small>/' + C.order.length + '</small></b><span>lessons complete</span></div><div class="kpi"><b>' + mastered + '</b><span>skills mastered</span></div><div class="kpi"><b>' + fmtDur(S.practice.total) + '</b><span>total practice</span></div><div class="kpi"><b>' + streak + '</b><span>day streak</span></div><div class="kpi"><b>' + projDone + '</b><span>songs finished</span></div></section>' +
    '<section class="card"><h3>Practice, last 14 days</h3>' + chart + '</section>' +
    '<section class="card"><h3>Strengths and weak spots</h3>' + (weak.length ? '<p><b>Needs work:</b> ' + weak.map(c => esc(c.k)).join(', ') + '.</p>' : '') + (strong.length ? '<p><b>Strong:</b> ' + strong.slice(0, 4).map(c => esc(c.k)).join(', ') + '.</p>' : '') + skillRows + '</section>' +
    '<section class="card"><h3>Skill tree</h3><p class="muted">Each dot is a lesson. Hollow is not started, filled is complete, starred is mastered, grey is locked.</p><div class="tree">' + tree + '</div></section>' +
    '<section class="card"><h3>Recent assessment scores</h3>' + (scores.length ? '<ul class="lessons">' + scores.map(s => '<li class="lrow"><div class="lmain"><b>' + esc(s.title) + '</b><span class="tiny">' + new Date(s.at).toLocaleDateString() + ' · ' + (s.kind === 'testout' ? 'test-out' : 'lesson') + '</span></div><b class="mono">' + s.pct + '%</b></li>').join('') + '</ul>' : '<p class="muted">No scores yet.</p>') + '</section>' +
    '<section class="card"><h3>Achievements</h3><ul class="badges">' + ach + '</ul></section></div>';
  return { html };
}

/* ---------------------------------------------------------------- PROFILE */
function viewProfile() {
  const d = S.profile.diag;
  const html = '<div class="screen narrow"><div class="pagehead"><h1>Profile</h1></div>' +
    '<section class="card"><label class="field"><span>Your name</span><input id="pname" type="text" maxlength="40" value="' + esc(S.profile.name) + '" data-bind="pname" autocomplete="given-name"></label>' +
    '<p class="eyebrow">Learning goals</p><div class="chips">' + GOALS.map(g => '<button type="button" class="chip' + (S.profile.goals.includes(g) ? ' on' : '') + '" data-act="pgoal" data-g="' + esc(g) + '" aria-pressed="' + S.profile.goals.includes(g) + '">' + esc(g) + '</button>').join('') + '</div></section>' +
    '<section class="card"><h3>Preferences</h3><p class="eyebrow">Daily practice goal</p><div class="seg">' + [5, 10, 15, 20, 30].map(n => '<button type="button" class="' + (S.prefs.dailyMin === n ? 'on' : '') + '" data-act="pgoalmin" data-v="' + n + '">' + n + ' min</button>').join('') + '</div>' +
    '<label class="switch"><input type="checkbox" data-bind="pnames"' + (S.prefs.names ? ' checked' : '') + '><span>Show note names on the piano</span></label>' +
    '<label class="switch"><input type="checkbox" data-bind="psound"' + (S.prefs.sound ? ' checked' : '') + '><span>Sound on</span></label>' + soundPicker() +
    '<label class="switch"><input type="checkbox" data-bind="pslow"' + (S.prefs.speed === 'slow' ? ' checked' : '') + '><span>Play examples slowly by default</span></label></section>' +
    soundCard() +
    '<section class="card"><h3>MIDI keyboard</h3><p id="miditext">' + esc(Midi.text()) + '</p>' + (Midi.supported ? (Midi.status === 'ready' ? '<button class="btn ghost" data-act="mididisc">Disconnect</button>' : '<button class="btn primary" data-act="midiconnect">Connect a MIDI keyboard</button>') : '') + '<p class="tiny">A USB or Bluetooth keyboard plays every exercise, chord checker and test in the app, with the same feedback as the on-screen keys.</p></section>' +
    '<section class="card"><h3>Placement check</h3>' + (d ? '<p>Your last check scored ' + d.pct + '%.</p>' : '<p class="muted">You have not taken the placement check.</p>') + '<button class="btn ghost" data-act="retake">' + (d ? 'Retake the check' : 'Take the check') + '</button></section>' +
    backupCard() +
    '<section class="card"><h3>Reset</h3><p class="muted">Clears lessons, XP, practice time and song projects.</p><button class="btn ghost" data-act="reset">' + (ui.confirmReset ? 'Tap again to erase everything' : 'Reset all progress') + '</button></section></div>';
  return { html };
}

/* ---------------------------------------------------------------- actions (click) and bindings (change/input) */
const ACTIONS = {
  skipmain: () => { const m = mainEl(); if (m) { m.focus(); m.scrollIntoView(); } },
  go: el => go(el.dataset.to),
  pexport: () => exportProgress(),
  pimportpick: () => { const f = $('#pimportfile'); if (f) f.click(); },
  pimportapply: () => applyImport(),
  pimportcancel: () => { ui.importPending = null; ui.importMsg = ''; render(); },
  midiconnect: () => { Midi.connect().then(ok => { if (ok && Midi.status === 'ready') toast('MIDI keyboard connected'); }); },
  mididisc: () => Midi.disconnect(),
  lstep: el => { ui.lesson.step = +el.dataset.i; ui.lesson.pi = 0; render(); window.scrollTo(0, 0); },
  lprev: () => { ui.lesson.step = Math.max(0, ui.lesson.step - 1); ui.lesson.pi = 0; render(); window.scrollTo(0, 0); },
  lnext: () => { const n = lessonSteps(C.byId[ui.lesson.id]).length; ui.lesson.step = Math.min(n - 1, ui.lesson.step + 1); ui.lesson.pi = 0; render(); window.scrollTo(0, 0); },
  lpi: el => { ui.lesson.pi = +el.dataset.i; render(); },
  lgo: el => { const steps = lessonSteps(C.byId[ui.lesson.id]); ui.lesson.step = Math.max(0, steps.indexOf(el.dataset.step)); ui.lesson.pi = 0; render(); window.scrollTo(0, 0); },
  openlesson: el => openLesson(el.dataset.id),
  songpreset: el => { sl.pid = el.dataset.id; sl.key = el.dataset.key; sl.sev = el.dataset.sev === '1'; sl.degs = E.PROGRESSIONS.find(x => x.id === sl.pid).degs.slice(); sl.autoplay = false; go('song'); },
  toglevel: el => { const id = el.dataset.id; const cur = ui.courseOpen[id]; const nl = nextLesson(); const dflt = id === (nl ? C.byId[nl].level : 'G'); ui.courseOpen[id] = cur === undefined ? !dflt : !cur; render(); },
  testout: el => openTestout(el.dataset.id),
  toplay: () => { ui.testout.stage = 'play'; ui.testout.ex = 0; render(); },
  pview: el => go('practice', { view: el.dataset.view, type: el.dataset.type, kind: el.dataset.kind, sid: el.dataset.sid, proj: el.dataset.proj }),
  /* onboarding */
  obnext: () => {
    const ob = ui.onboarding;
    if (ob.step === 1) { ob.name = ($('#ob-name') || {}).value || ob.name; }
    if (ob.step === 3) { if (!ob.result) return; ob.step = 4; render(); return; }
    ob.step++; render(); window.scrollTo(0, 0);
  },
  obback: () => { const ob = ui.onboarding; if (ob.step === 1) { ob.name = ($('#ob-name') || {}).value || ob.name; } ob.step--; render(); },
  obskip: () => { S.profile.onboarded = true; touch(); ui.onboarding = null; go('home'); },
  obgoal: el => { const ob = ui.onboarding; ob.name = ($('#ob-name') || {}).value || ob.name; const g = el.dataset.g; ob.goals = ob.goals.includes(g) ? ob.goals.filter(x => x !== g) : ob.goals.concat([g]); render(); },
  obself: el => { ui.onboarding.self[el.dataset.r] = el.dataset.v; render(); },
  obfinish: () => {
    const ob = ui.onboarding;
    S.profile.name = (ob.name || '').trim(); S.profile.goals = ob.goals; S.profile.onboarded = true;
    S.profile.diag = { pct: ob.diag ? ob.diag.pct : 0, per: ob.diag ? ob.diag.per : {}, self: ob.self, at: Date.now() };
    if (ob.diag) { Object.keys(ob.diag.per).forEach(k => { if (ob.diag.per[k] >= 75) S.recommend[k] = true; else delete S.recommend[k]; }); S.scores.push({ kind: 'testout', id: 'placement', title: 'Placement check', pct: ob.diag.pct, at: Date.now() }); }
    touch(); ui.onboarding = null; go('home');
  },
  /* lab */
  labtab: el => { lab.tab = el.dataset.v; render(); },
  labroot: el => { lab.root = el.dataset.v; render(); labPlay('block'); },
  labq: el => { lab.quality = el.dataset.v; lab.inv = 0; render(); labPlay('block'); },
  labinv: el => { lab.inv = +el.dataset.v; render(); labPlay('block'); },
  labplay: el => labPlay(el.dataset.mode),
  sustaintoggle: () => { Snd.ensure(); Snd.pedal(!Snd.pedalSrcHas('latch'), 'latch'); },
  labclear: () => { if (lab.clear) lab.clear(); },
  sroot: el => { lab.sroot = el.dataset.v; render(); },
  stype: el => { lab.stype = el.dataset.v; render(); },
  splay: el => scalePlay(el.dataset.mode),
  /* song lab */
  slplay: () => { if (sl.toggle) sl.toggle(); },
  sladd: el => { if (sl.degs.length >= 8) { toast('Eight chords is the maximum.'); return; } if (sl.pid !== 'custom') { sl.pid = 'custom'; sl.degs = []; } sl.degs.push(+el.dataset.d); render(); },
  slundo: () => { sl.pid = 'custom'; sl.degs.pop(); if (!sl.degs.length) sl.degs = [1]; render(); },
  slclear: () => { sl.pid = 'custom'; sl.degs = [1]; render(); },
  slnew: () => newProject(),
  openproj: el => go('song', { pid: el.dataset.id }),
  padd: el => { const P = curProj(); if (P.degs.length >= 4) { toast('A four-chord progression has four chords. Remove one to change it.'); return; } P.degs.push(+el.dataset.d); P.steps.prog = false; touch(); render(); },
  pundo: () => { const P = curProj(); P.degs.pop(); P.steps.prog = false; touch(); render(); },
  pmidi: () => {
    const P = curProj(); if (!P) return;
    if (!P.degs.length) { toast('Add at least one chord first.'); return; }
    const sel = $('#expmel'), r = exportMidi(P, sel ? sel.value : 'chorus');
    toast(r.L.hasMel ? 'MIDI file ready: chords, bass and melody.' : 'MIDI file ready: chords and bass. Record a melody to add it.');
  },
  pchart: () => {
    const P = curProj(); if (!P) return;
    if (!P.degs.length) { toast('Add at least one chord first.'); return; }
    exportChart(P); toast('Chord chart ready. Open it and print or save as PDF.');
  },
  pplay: () => { const P = curProj(), ps = progScript(P.key, P.degs, P.sev, P.style, P.bpm); Snd.play(ps.script, { force: true, inst: () => Snd.inst() }); },
  pstep: el => { const P = curProj(), k = el.dataset.k; if (P.steps[k]) return; P.steps[k] = true; award(25, 'song step'); if (Object.values(P.steps).every(Boolean) && !P.done) { P.done = true; award(100, 'song finished'); } touch(); checkAch(); render(); },
  padds: el => { const P = curProj(); if (P.structure.length >= 14) return; P.structure.push(el.dataset.s); P.steps.song = false; touch(); render(); },
  prems: el => { const P = curProj(); P.structure.splice(+el.dataset.i, 1); P.steps.song = false; touch(); render(); },
  pdel: el => { if (ui.confirmDel === el.dataset.id) { S.songs = S.songs.filter(s => s.id !== el.dataset.id); ui.confirmDel = null; touch(); go('song'); } else { ui.confirmDel = el.dataset.id; render(); } },
  /* profile */
  pgoal: el => { const g = el.dataset.g; S.profile.goals = S.profile.goals.includes(g) ? S.profile.goals.filter(x => x !== g) : S.profile.goals.concat([g]); touch(); render(); },
  pgoalmin: el => { S.prefs.dailyMin = +el.dataset.v; touch(); render(); },
  retake: () => { ui.onboarding = { step: 3, self: (S.profile.diag && S.profile.diag.self) || {}, goals: S.profile.goals.slice(), name: S.profile.name }; S.profile.onboarded = true; go('onboarding'); },
  reset: () => { if (ui.confirmReset) { ui.confirmReset = false; App.resetState(); ui.onboarding = null; ui.lesson = null; try { localStorage.removeItem(LS_KEY); } catch (e) { /* ignore */ } go('onboarding'); } else { ui.confirmReset = true; render(); setTimeout(() => { if (ui.confirmReset) { ui.confirmReset = false; if (route.name === 'profile') render(); } }, 5000); } }
};
const curProj = () => S.songs.find(s => s.id === (route.params || {}).pid);
const BINDS = {
  slkey: el => { sl.key = el.value; render(); },
  slprog: el => { sl.pid = el.value; if (el.value !== 'custom') { const p = E.PROGRESSIONS.find(x => x.id === el.value); sl.degs = p.degs.slice(); sl.sev = p.sev; } render(); },
  slstyle: el => { sl.style = el.value; render(); },
  slbpm: el => { sl.bpm = +el.value; const v = $('#slbpmv'); if (v) v.textContent = sl.bpm; },
  slsev: el => { sl.sev = el.checked; render(); },
  pkey: el => { const P = curProj(); P.key = el.value; touch(); render(); },
  pstyle: el => { const P = curProj(); P.style = el.value; touch(); render(); },
  psev: el => { const P = curProj(); P.sev = el.checked; touch(); render(); },
  ptitle: el => { const P = curProj(); P.title = el.value; touch(); },
  lchorus: el => { const P = curProj(); P.lyrics.chorus = el.value; P.steps.chorus = P.steps.chorus && el.value.trim().length > 0; touch(); },
  lverse: el => { const P = curProj(); P.lyrics.verse = el.value; touch(); },
  lbridge: el => { const P = curProj(); P.lyrics.bridge = el.value; touch(); },
  labkey: el => { lab.key = el.value; render(); },
  obname: el => { ui.onboarding.name = el.value; },
  pname: el => { S.profile.name = el.value; touch(); chrome(); },
  pimport: el => { const f = el.files && el.files[0]; el.value = ''; readBackupFile(f); },
  pnames: el => { S.prefs.names = el.checked; touch(); },
  instpick: el => { S.prefs.instrument = Snd.hasInst(el.value) ? el.value : 'piano'; touch(); Snd.releaseAll(); Snd.preview(); },
  psound: el => { S.prefs.sound = el.checked; touch(); },
  pslow: el => { S.prefs.speed = el.checked ? 'slow' : 'normal'; touch(); }
};
const LIVE = new Set(['slbpm', 'ptitle', 'lchorus', 'lverse', 'lbridge', 'obname', 'pname']);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => { const b = e.target.dataset && e.target.dataset.bind; if (b && BINDS[b] && !LIVE.has(b)) BINDS[b](e.target); else if (b && LIVE.has(b)) BINDS[b](e.target); });
document.addEventListener('input', e => { const b = e.target.dataset && e.target.dataset.bind; if (b && LIVE.has(b)) BINDS[b](e.target); });

/* ---------------------------------------------------------------- boot */
function buildChrome() {
  $('#app').innerHTML =
    '<button type="button" class="skip-link" data-act="skipmain">Skip to main content</button>' +
    '<header class="top"><div class="top-in"><button class="brand" type="button" data-act="go" data-to="home" aria-label="Gospel Piano Academy, home"><svg viewBox="0 0 28 28" width="28" height="28" aria-hidden="true"><rect x="1" y="3" width="26" height="22" rx="5" class="bm-a"/><path d="M8 3v22M14 3v22M20 3v22" class="bm-b"/><rect x="6" y="3" width="4" height="12" rx="1" class="bm-c"/><rect x="12" y="3" width="4" height="12" rx="1" class="bm-c"/><rect x="18" y="3" width="4" height="12" rx="1" class="bm-c"/></svg><span>Gospel Piano Academy</span></button>' +
    '<nav class="topnav" aria-label="Main">' + NAV.map(n => '<button type="button" data-act="go" data-to="' + n[0] + '" data-nav="' + n[0] + '">' + n[1] + '</button>').join('') + '</nav>' +
    '<div class="top-r"><button id="hxp" class="chip-xp" type="button" data-act="go" data-to="progress" aria-label="Progress"></button><button id="hav" class="avatar" type="button" data-act="go" data-to="profile" aria-label="Profile"></button></div></div></header>' +
    '<main id="main" tabindex="-1"></main>' +
    '<nav class="tabbar" aria-label="Main">' + NAV.map(n => '<button type="button" data-act="go" data-to="' + n[0] + '" data-nav="' + n[0] + '">' + icon(n[2]) + '<span>' + n[1] + '</span></button>').join('') + '</nav>' +
    '<div id="toast" class="toast" role="status" aria-live="polite"></div>';
}
function boot() {
  buildChrome();
  ensureToday();
  route = S.profile.onboarded ? { name: 'home', params: {} } : { name: 'onboarding', params: {} };
  render();
  checkAch();
  Sync.init();
  Midi.onChange = () => { if (route && (route.name === 'profile' || route.name === 'lab')) render(); };
  if (S.prefs.midi && Midi.supported) Midi.connect();
  window.__gpa = { Midi, S: () => S, go, ui, lab, sl, E, C, Input, Snd, Piano, mountExercise, lessonStatus, isUnlocked, evalLesson, route: () => route, ACTIONS, render };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
